<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jason Leeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161a23;
      --border: rgba(255,255,255,0.08);
      --text: #e8e6e1;
      --muted: #7a8494;
      --accent: #c8a96e;
      --accent-dim: rgba(200,169,110,0.15);
      --glow: rgba(200,169,110,0.25);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── SKYLINE BANNER ── */
    .banner {
      width: 100%;
      height: 260px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #0a1628 0%, #112240 40%, #1a3a5c 70%, #0d0f14 100%);
    }

    /* Stars */
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 40% 15%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 8%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 12%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 5%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 30%, rgba(255,255,255,0.4) 0%, transparent 100%);
    }

    /* Water reflection */
    .water {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 60px;
      background: linear-gradient(180deg, transparent 0%, rgba(17,34,64,0.6) 50%, rgba(10,22,40,0.8) 100%);
    }
    .water::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 40px,
        rgba(200,169,110,0.04) 40px,
        rgba(200,169,110,0.04) 80px
      );
    }

    /* SVG Skyline */
    .skyline-svg {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, 100%);
      height: 180px;
    }

    /* Moon */
    .moon {
      position: absolute;
      top: 24px;
      right: 12%;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #fff8e7, #f0d890);
      box-shadow: 0 0 30px 8px rgba(240,216,144,0.35), 0 0 60px 20px rgba(240,216,144,0.12);
    }

    /* ── PROFILE ── */
    .profile {
      margin-top: -40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      position: relative;
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      background: linear-gradient(135deg, #1e2a3a, #2a3a50);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--accent);
      box-shadow: 0 0 0 6px var(--bg), 0 0 24px var(--glow);
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── LINKS ── */
    .links {
      margin-top: 36px;
      width: min(420px, calc(100% - 40px));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent-dim);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .link-card:hover {
      border-color: rgba(200,169,110,0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(200,169,110,0.2);
    }

    .link-card:hover::before { opacity: 1; }

    .link-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 1;
    }

    .link-icon svg { width: 22px; height: 22px; }

    .link-text { z-index: 1; }
    .link-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 2px;
    }
    .link-title {
      font-size: 1rem;
      font-weight: 500;
    }

    .link-arrow {
      margin-left: auto;
      color: var(--muted);
      z-index: 1;
      transition: transform 0.25s ease, color 0.25s ease;
    }
    .link-card:hover .link-arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    /* Icon backgrounds */
    .ig   { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .fb   { background: #1877f2; }
    .em   { background: #2c3e50; }
    .li   { background: #0a66c2; }
    .mx   { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); }

    /* ── FOOTER ── */
    footer {
      margin: 48px 0 32px;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .profile  { animation: fadeUp 0.6s ease 0.1s both; }
    .links    { animation: fadeUp 0.6s ease 0.25s both; }
    footer    { animation: fadeUp 0.6s ease 0.4s both; }
  </style>
</head>
